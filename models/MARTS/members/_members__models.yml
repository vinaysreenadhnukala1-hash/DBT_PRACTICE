version: 2

models:
  - name: dim_members
    description: "Member dimension with plan info and claim summary metrics"
    columns:
      - name: member_sk
        tests:
          - unique
          - not_null
      - name: member_id
        tests:
          - unique
          - not_null
      - name: age_band
        tests:
          - accepted_values:
              values: ['Under 18', '18-34', '35-49', '50-64', '65+']
